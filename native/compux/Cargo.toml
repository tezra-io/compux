# compux OS-driver sidecar — the native screen-capture + input-injection helper.
#
# A standalone binary (NOT a Rustler NIF) that `Compux.PortDriver` spawns as an OS
# Port. It speaks the line-framed JSON protocol defined in lib/compux/protocol.ex:
# one request line in on stdin, one response line out on stdout. Kept a separate
# process on purpose — a GUI driver can segfault on a TCC denial or an xcap/enigo
# quirk, and a Port crash is recoverable where a NIF crash would down the BEAM.
#
# Build (dev loop):  cargo build --release  ->  target/release/compux
# Release builds are cross-compiled per target + signed/notarized by CI.

[package]
name = "compux"
version = "0.11.0"
edition = "2021"
description = "Native screen-capture + input-injection helper for the compux Elixir library"
license = "MIT"
repository = "https://github.com/tezra-io/compux"

[[bin]]
name = "compux"
path = "src/main.rs"

# The ownership badge on an X11 desktop, spawned by the helper beside it. Built on
# every platform so one `cargo build` stays one command; it draws only on Linux.
[[bin]]
name = "compux-indicator-x11"
path = "src/bin/compux-indicator-x11/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG encoding + downscale of the captured frame.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# macOS Accessibility query (`inspect`) + the non-prompting permission probe +
# the Accessibility grant PROMPT (`request_permissions`). core-foundation handles
# CFString/CFType/CFDictionary memory safety for the AX FFI. Already in the tree
# transitively via xcap, so this adds no new compilation.
[target.'cfg(target_os = "macos")'.dependencies]
# Synthetic input (CGEvent), screen capture (ScreenCaptureKit/CG) and the
# clipboard for `paste` (NSPasteboard). macOS only: Linux posts, captures and
# owns the clipboard through x11rb or the portal (M86 L2), with no C library.
enigo = "0.3"
xcap = "0.4"
arboard = "3"
core-foundation = "0.10"
dispatch2 = "0.3"
# posix_spawn + dlsym for the TCC responsibility self-disclaim re-exec (see
# `disclaim` in src/main.rs) — makes compux its own TCC responsible process.
libc = "0.2"
# ScreenCaptureKit, for a stream of ONE window's frames (`window_frames.rs`). The
# objc2 family, not a third-party wrapper: every crate it pulls in except
# `objc2-uniform-type-identifiers` is already in this tree at the same version via
# xcap's objc2 stack, the bindings are generated from Apple's own headers (so a
# name here is the name in the SDK), the whole family is MIT, and it needs no
# toolchain step beyond the stock macOS runner's SDK.
objc2 = "0.6"
block2 = "0.6"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCStream", "SCShareableContent", "SCError", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

# Linux accessibility (M86 L1): AT-SPI over D-Bus, pure Rust (no libdbus), driven
# with `async_io::block_on` (the executor zbus itself runs on) from the one action
# worker — no tokio, no runtime of our own. `futures-util` only for running a node's
# reads concurrently and bounding how many nodes are in flight.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Linux pixels (M86 L2): the X protocol in pure Rust, handed its display and its
# authority as values. XTEST posts input, RandR names the monitors, XKB says
# which group and modifiers the keyboard is in; capture is the core GetImage.
# A bound window (M86 L3) is read through Composite, watched through Damage, and
# its badge takes clicks only where Shape says.
x11rb = { version = "0.13", default-features = false, features = ["xtest", "randr", "xkb", "composite", "damage", "shape"] }
# What character an X keysym types, for every keysym a layout can name (the
# legacy Cyrillic, Greek and other tables as well as Unicode's).
xkeysym = "0.2"
# The X11 badge's text: glyphs outlined and rasterised in pure Rust from
# the unmodified Noto Sans in fonts/, whose SIL Open Font License sits beside it.
ab_glyph = "0.2"

# The reader's unit tests answer it from fake AT-SPI servers over a peer-to-peer
# connection: no bus daemon, no desktop.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "p2p"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
