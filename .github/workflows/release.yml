name: release

# Tag `vX.Y.Z` (matching mix.exs + Cargo.toml) and push it. Per target this
# cross-builds the crate and packs the release artifact; the publish job sha256s
# and cosign-signs (keyless/OIDC) every artifact, attaches everything to a GitHub
# Release and prints the checksum map to paste into `checksum-compux.exs`.
#
# Per-target artifact shape (Compux.Binary.artifact_name/2):
#   * macOS  — a Developer-ID-signed, notarized, STAPLED `Fermix.app` zipped with
#     ditto: `compux-<ver>-macos-aarch64.zip`. The bundle gives the sidecar a stable
#     TCC identity (io.tezra.fermix.computer-use) so Screen-Recording / Accessibility
#     grants persist across upgrades. It carries TWO executables — the helper and the
#     ownership indicator it spawns (`Contents/MacOS/compux-indicator`, compiled by
#     scripts/build_app.sh from native/indicator for the HELPER's architectures) —
#     under ONE signature, so Privacy settings still shows one "Fermix" and the badge
#     needs no grant of its own. Signing is MANDATORY: the build fails loud if the
#     Apple secrets are absent (never ships an ad-hoc bundle, whose per-build identity
#     would re-prompt every upgrade).
#   * Linux  — a bare `compux` binary tarball: `compux-<ver>-linux-x86_64.tar.gz`
#     (no TCC on X11; nothing to sign).
#
# Who holds what. The build jobs run third-party crate build code, so they hold
# no credential and may only read. The helper is signed in its own job,
# sign-macos, which downloads the unsigned binary, runs in the `release-macos`
# environment and is the only job that reads the Apple secrets, each in the one
# step that needs it. Only publish can mint a Sigstore certificate or write the
# release. A run on anything but a v*.*.* tag, a dispatch included, is refused
# before anything is built.
#
# Apple secrets (a partial set fails the early validate guard, loud), kept as
# secrets of the `release-macos` environment:
#   MACOS_CERT_P12_BASE64   base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD     its export password
#   MACOS_KEYCHAIN_PASSWORD an ephemeral CI keychain password
#   MACOS_DEVELOPER_ID      e.g. "Developer ID Application: Tezra (TEAMID)"
#   APPLE_ID                Apple ID email for notarytool
#   APPLE_TEAM_ID           the 10-char team id
#   APPLE_APP_PASSWORD      an app-specific password for notarytool
# cosign is keyless (Sigstore OIDC) and needs no secret.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # A dispatch runs this workflow on whatever ref it is given, and only a
  # release tag, the same v*.*.* the push trigger matches, may be built, signed
  # and notarized.
  preflight:
    name: refuse a non-tag ref
    runs-on: ubuntu-24.04
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*.*.*) echo "releasing $REF" ;;
            *)
              echo "::error title=Not a release tag::release.yml builds, signs and notarizes only a v*.*.* tag; dispatch it on the tag, not $REF"
              exit 1
              ;;
          esac

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            os: macos-14
          - target: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Linux — install system libs (xcap/enigo/arboard link deps)
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libdbus-1-dev libxdo-dev

      - name: Build (release, locked)
        working-directory: native/compux
        run: cargo build --release --locked

      # Leaves unsigned: sign-macos signs it on a runner that never ran this
      # build's dependency code.
      - name: macOS — upload the unsigned helper
        if: matrix.target == 'macos-aarch64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-macos-aarch64
          path: native/compux/target/release/compux
          if-no-files-found: error

      - name: Linux — package the binary
        if: matrix.target == 'linux-x86_64'
        env:
          BIN_DIR: native/compux/target/release
        run: |
          set -euo pipefail
          tar -czf "compux-${REF_NAME#v}-${TARGET}.tar.gz" -C "$BIN_DIR" compux

      - name: Linux — upload the artifact
        if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: compux-*.tar.gz
          if-no-files-found: error

  sign-macos:
    name: sign macos-aarch64
    needs: build
    runs-on: macos-14
    environment: release-macos
    env:
      TARGET: macos-aarch64
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the unsigned helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-macos-aarch64
          path: unsigned

      - name: Validate signing secrets are complete
        # Signing is MANDATORY on macOS: fail loud + early if ANY of the seven is
        # missing, rather than shipping an ad-hoc bundle or dying mid-notarization.
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for v in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_KEYCHAIN_PASSWORD \
                   MACOS_DEVELOPER_ID APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::macOS signing is mandatory but these secrets are unset:$missing. Configure all seven for the compux repo's release-macos environment and re-run."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Build + sign Fermix.app
        env:
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          # Wrap the helper in the Fermix.app bundle and sign it (hardened runtime).
          # This also compiles the ownership indicator from native/indicator and signs
          # it inside the bundle, for the architectures the helper itself was built for.
          scripts/build_app.sh unsigned/compux Fermix.app "${REF_NAME#v}" "$DEVELOPER_ID"

          # Both executables, or the badge is missing from a release nobody notices
          # until the first target is selected. `lipo` exits non-zero on a missing file.
          lipo -archs Fermix.app/Contents/MacOS/compux
          lipo -archs Fermix.app/Contents/MacOS/compux-indicator

      - name: Notarize + staple Fermix.app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Notarize the bundle (submit a zip; the ticket is stapled to the .app so
          # Gatekeeper works offline). Submit WITHOUT --wait, then poll: `--wait` holds
          # one HTTP loop open for the whole scan (an hour+ on a first submission) and
          # dies on any transient runner blip. Bounded: 48 polls x 150s = 2h ceiling.
          ditto -c -k --keepParent Fermix.app notarize.zip
          sub_id=$(xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --output-format json | jq -r '.id')
          rm -f notarize.zip
          echo "notarization submission: $sub_id"
          state="In Progress"
          for attempt in $(seq 1 48); do
            state=$(xcrun notarytool info "$sub_id" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
              --output-format json 2>/dev/null | jq -r '.status' || echo "network-error")
            echo "notarization status ($attempt/48): $state"
            case "$state" in
              "Accepted") break ;;
              "Invalid"|"Rejected") break ;;
              *) sleep 150 ;;
            esac
          done
          if [ "$state" != "Accepted" ]; then
            echo "::error title=Notarization did not complete::status=$state (submission $sub_id)"
            xcrun notarytool log "$sub_id" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple Fermix.app
          codesign --verify --deep --strict --verbose=2 Fermix.app

      # Nothing after this signs, so the identity leaves the runner before the
      # steps that follow run.
      - name: Remove the signing keychain
        run: security delete-keychain build.keychain

      - name: Package Fermix.app
        run: |
          set -euo pipefail
          # ditto-zip the stapled bundle (preserves _CodeSignature/xattrs).
          ditto -c -k --keepParent Fermix.app "compux-${REF_NAME#v}-${TARGET}.zip"

      - name: Upload the artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-aarch64
          path: compux-*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, sign-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: sha256 + cosign sign-blob (keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          for f in compux-*.tar.gz compux-*.zip; do
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      - name: Print checksum map (paste into checksum-compux.exs)
        working-directory: dist
        run: |
          set -euo pipefail
          echo "%{"
          for f in compux-*.tar.gz compux-*.zip; do
            [ -e "$f" ] || continue
            target="$(echo "$f" | sed -E 's/^compux-[0-9.]+-(.+)\.(tar\.gz|zip)$/\1/')"
            printf '  "%s" => "%s",\n' "$target" "$(cat "$f.sha256")"
          done
          echo "}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        working-directory: dist
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$REF_NAME" \
            --generate-notes \
            compux-*.tar.gz compux-*.tar.gz.sha256 compux-*.tar.gz.sig compux-*.tar.gz.pem \
            compux-*.zip compux-*.zip.sha256 compux-*.zip.sig compux-*.zip.pem
