name: linux-desktop

# compux on a Linux desktop, in containers: a private Xvfb, a private session bus
# and its own accessibility bus (at-spi2-core), with the GTK 3, GTK 4 and Qt fixture
# apps (fixtures/linux). Nothing here has a desktop to reach: every session runs in
# a container with no network, started by fixtures/linux/spike/spike.sh.
#
#   noble  Ubuntu 24.04: `elements` timed on each fixture, then every verb compux
#          answers, judged by what the fixture recorded (verbs.py).
#   jammy  Ubuntu 22.04, whose ATK bridge 2.38 aborts an application on
#          Action.GetActions: the GTK 3 fixture read, then every verb on it, each
#          under a bus monitor that must show no GetActions and no GetAll.
#   x11-pixels  Ubuntu 24.04: the X11 pixel route on the GTK 3 fixture (pixels.py):
#          XTEST clicks and keys, a paste through the selection compux owns, the
#          frame against a pattern on the root, a refused character off the
#          layout, and a button a killed helper held released by the next one.
#   x11-bound  Ubuntu 24.04 under openbox: the GTK 3 fixture bound (bound.py)
#          with none of a covering window's pixels in its first frame, captured
#          while covered, its transient dialog listed and pressed through the
#          binding and focus in it not the bound window's, a mark of a bound
#          screenshot pressed through the binding, a covered point and a
#          point under a popup refused, the
#          X11 badge's buttons clicked as a person would and judged by the gate
#          and by what the window under a missed click recorded, a click another
#          program sends dropped, a reused window id and a window that never
#          repaints refused, twenty select and release cycles, and on a second X
#          server with no window manager a window with an X border read from
#          inside it and the badge kept over its window but under a popup.
#   no-c-deps  the helper and its X11 badge built and tested in plain Ubuntu 24.04
#          with no C library but the C runtime (no_c_deps.sh), their links
#          checked, and clippy for aarch64-unknown-linux-gnu.

# Each job builds its images from scratch (the fixture images for both releases,
# the helper's build image, the helper, the spike images) before its sessions run,
# so it runs only when what it tests changed, or by hand.
on:
  push:
    branches: [main]
    paths:
      - native/compux/**
      - lib/**
      - fixtures/linux/**
      - .github/workflows/linux-desktop.yml
  pull_request:
    paths:
      - native/compux/**
      - lib/**
      - fixtures/linux/**
      - .github/workflows/linux-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noble:
    name: fixtures on Ubuntu 24.04 (elements + verbs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Elements and verbs on GTK 3, GTK 4 and Qt
        env:
          SPIKE_STAGES: a verbs
          SPIKE_CACHE: ${{ runner.temp }}/spike-cache
        run: fixtures/linux/spike/spike.sh "$RUNNER_TEMP/spike-out" 5
      - name: Keep what the sessions wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-noble
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: warn

  jammy:
    name: GTK 3 under ATK bridge 2.38 (Ubuntu 22.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: No GetActions, no GetAll, and the verbs, on GTK 3 in 22.04
        env:
          SPIKE_STAGES: b verbs-jammy
          SPIKE_CACHE: ${{ runner.temp }}/spike-cache
        run: fixtures/linux/spike/spike.sh "$RUNNER_TEMP/spike-out" 5
      - name: Keep what the session wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-jammy
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: warn

  x11-pixels:
    name: X11 pixels on GTK 3 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: XTEST, GetImage, the owned selection and the held-input journal
        env:
          SPIKE_STAGES: pixels
          SPIKE_CACHE: ${{ runner.temp }}/spike-cache
        run: fixtures/linux/spike/spike.sh "$RUNNER_TEMP/spike-out" 1
      - name: Keep what the session wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-x11-pixels
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: warn

  x11-bound:
    name: a bound window and its badge on X11 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Composite capture under a cover, the badge, a reused id, twenty cycles
        env:
          SPIKE_STAGES: bound
          SPIKE_CACHE: ${{ runner.temp }}/spike-cache
        run: fixtures/linux/spike/spike.sh "$RUNNER_TEMP/spike-out" 1
      - name: Keep what the session wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-x11-bound
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: warn

  no-c-deps:
    name: no C library but the C runtime (build, test, aarch64 clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in plain Ubuntu 24.04
        run: fixtures/linux/spike/no_c_deps.sh "$RUNNER_TEMP/no-c-deps-out"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-no-c-deps
          path: ${{ runner.temp }}/no-c-deps-out
          if-no-files-found: warn
